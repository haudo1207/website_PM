name: Deploy KPI production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to deploy main to both production brands
        required: true
        type: string

jobs:
  deploy-both-brands:
    if: inputs.confirm == 'DEPLOY' || inputs.confirm == 'deploy' || inputs.confirm == 'Deploy'
    runs-on: [self-hosted, security]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prune docker cache
        run: |
          docker system prune -f || true
          docker builder prune -f || true
      - name: Sync and deploy both brands
        env:
          APP_COMMIT: ${{ github.sha }}
          SOURCE_DIR: /home/portalkpi/website_PM
          FRONTEND_PORT: "3000"
          MARKEE_FRONTEND_PORT: "3300"
        run: |
          set -euo pipefail
          rsync -a --delete --exclude .git --exclude .env --exclude secrets --exclude backups --exclude frontend/data ./ "$SOURCE_DIR"/
          cp deploy/security-prod.compose.yml "$SOURCE_DIR/docker-compose.yml"
          cd "$SOURCE_DIR"
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".env")
          if not path.is_file():
              raise SystemExit(f"Required runtime env file is missing: {path.resolve()}")

          updates = {
              "OUTLOOK_LOGIN_ENABLED": "true",
              "OUTLOOK_CLIENT_ID": "accb9e53-bce9-4828-9bf9-7f655ed19090",
              "OUTLOOK_TENANT_ID": "common",
              "GOOGLE_CLIENT_ID": "780122821631-42d0p2cons73hn7eonrd605dcmnmemt1.apps.googleusercontent.com",
              "GOOGLE_CLIENT_SECRET": "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",
              "GOOGLE_REFRESH_TOKEN": "1//0gc4RYP77PoncCgYIARAAGBASNwF-L9IryEHtLi-sw-gXGHoLGTEQf9PhJDimncDu9wCck2BIGAD7LjIBiPo-3EtE38VOa81lNXA",
              "AI_BASE_URL": "https://api.shopaikey.com/v1",
              "GEMINI_API_KEY": "sk-w9W6LeRIVhSXu7YFaM12hU7ZLjg38tJ34IBy59CB9NxrEkOr",
              "AI_API_KEY": "sk-w9W6LeRIVhSXu7YFaM12hU7ZLjg38tJ34IBy59CB9NxrEkOr",
              "AI_MODEL": "gpt-4o",
              "ASSEMBLYAI_API_KEY": "9fcea11b84c54a7882455d271d5722e0",
              "TELEGRAM_BOT_TOKEN": "8923394127:AAHPjZsLIRmDm9nk4Rzc1Oce68PwvhL3vbQ",
              "TELEGRAM_BOT_USERNAME": "cloudgate_pm_bot",
              "TELEGRAM_GROUP_CHAT_ID": "-1003890947468",
              "TELEGRAM_MESSAGE_THREAD_ID": "2",
          }
          lines = path.read_text().splitlines()
          output = []
          seen = set()
          for line in lines:
              if "=" not in line or line.lstrip().startswith("#"):
                  output.append(line)
                  continue
              key, _ = line.split("=", 1)
              key = key.strip()
              if key in updates:
                  if key not in seen:
                      output.append(f"{key}={updates[key]}")
                      seen.add(key)
              else:
                  output.append(line)
          for key, value in updates.items():
              if key not in seen:
                  output.append(f"{key}={value}")
          path.write_text("\n".join(output) + "\n")
          PY
          # Retry the build a few times — transient DNS/registry blips pulling
          # base images (python:3.11-slim, node:20-alpine) shouldn't fail the
          # whole deploy on their own.
          attempt=1
          max_attempts=3
          until docker compose --env-file .env -f docker-compose.yml build backend frontend frontend_markee zalo-worker; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Docker build failed after $max_attempts attempts" >&2
              exit 1
            fi
            echo "Docker build failed (attempt $attempt/$max_attempts) — retrying in 15s..."
            attempt=$((attempt + 1))
            sleep 15
          done
          docker compose --env-file .env -f docker-compose.yml run --rm --no-deps \
            backend python -c "from app.main import run_startup_once; run_startup_once()"
          docker compose --env-file .env -f docker-compose.yml up -d --no-build --remove-orphans
          timeout 300 bash -c 'until curl -fsS http://127.0.0.1:3000/api/health; do sleep 5; done'
          timeout 300 bash -c 'until curl -fsS http://127.0.0.1:3300/api/health; do sleep 5; done'
