name: Deploy KPI production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to deploy main to both production brands
        required: true
        type: string

jobs:
  deploy-both-brands:
    if: inputs.confirm == 'DEPLOY' || inputs.confirm == 'deploy' || inputs.confirm == 'Deploy'
    runs-on: [self-hosted, security]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prune docker cache
        run: |
          docker system prune -f || true
          docker builder prune -f || true
      - name: Sync and deploy both brands
        env:
          APP_COMMIT: ${{ github.sha }}
          SOURCE_DIR: /home/portalkpi/website_PM
          FRONTEND_PORT: "3000"
          MARKEE_FRONTEND_PORT: "3300"
        run: |
          set -euo pipefail
          rsync -a --delete --exclude .git --exclude .env --exclude secrets --exclude backups --exclude frontend/data ./ "$SOURCE_DIR"/
          cp deploy/security-prod.compose.yml "$SOURCE_DIR/docker-compose.yml"
          cd "$SOURCE_DIR"
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".env")
          if not path.is_file():
              raise SystemExit(f"Required runtime env file is missing: {path.resolve()}")

          updates = {
              "OUTLOOK_LOGIN_ENABLED": "true",
              "OUTLOOK_CLIENT_ID": "accb9e53-bce9-4828-9bf9-7f655ed19090",
              "OUTLOOK_TENANT_ID": "common",
          }
          lines = path.read_text().splitlines()
          output = []
          seen = set()
          for line in lines:
              if "=" not in line or line.lstrip().startswith("#"):
                  output.append(line)
                  continue
              key, _ = line.split("=", 1)
              key = key.strip()
              if key in updates:
                  if key not in seen:
                      output.append(f"{key}={updates[key]}")
                      seen.add(key)
              else:
                  output.append(line)
          for key, value in updates.items():
              if key not in seen:
                  output.append(f"{key}={value}")
          path.write_text("\n".join(output) + "\n")
          PY
          docker compose --env-file .env -f docker-compose.yml build backend frontend frontend_markee
          docker compose --env-file .env -f docker-compose.yml run --rm --no-deps \
            backend python -c "from app.main import run_startup_once; run_startup_once()"
          docker compose --env-file .env -f docker-compose.yml up -d --no-build --remove-orphans
          timeout 300 bash -c 'until curl -fsS http://127.0.0.1:3000/api/health; do sleep 5; done'
          timeout 300 bash -c 'until curl -fsS http://127.0.0.1:3300/api/health; do sleep 5; done'
