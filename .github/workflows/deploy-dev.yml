name: Deploy KPI dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: kpi-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, kpi-dev]
    steps:
      - uses: actions/checkout@v4
      - name: Sync source and compose
        run: |
          set -euo pipefail
          mkdir -p /home/webpm/kpi-dev-src /home/webpm/kpi-dev
          rsync -a --delete --exclude .git ./ /home/webpm/kpi-dev-src/
          cp deploy/security-dev.compose.yml /home/webpm/kpi-dev/compose.yml
      - name: Build and deploy
        working-directory: /home/webpm/kpi-dev
        env:
          APP_COMMIT: ${{ github.sha }}
          SOURCE_DIR: /home/webpm/kpi-dev-src
          FRONTEND_PORT: "3100"
        run: |
          set -euo pipefail
          docker compose --env-file .env -f compose.yml up -d --build --remove-orphans
          timeout 180 bash -c 'until curl -fsS http://127.0.0.1:3100/api/health; do sleep 5; done'
          docker image prune -f --filter 'until=168h'
