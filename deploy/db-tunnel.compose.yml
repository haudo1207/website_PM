name: kpi_dev_db_tunnel

services:
  server:
    image: ghcr.io/erebe/wstunnel:v10.6.1
    container_name: kpi_dev_db_tunnel
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/home/app/wstunnel"]
    command:
      - server
      - --log-lvl
      - WARN
      - --restrict-to
      - localhost:5432
      - --restrict-http-upgrade-path-prefix
      - ${DB_TUNNEL_PATH:?Set DB_TUNNEL_PATH in tunnel.env}
      - ws://0.0.0.0:8080
