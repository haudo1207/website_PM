name: website_pm

services:
  backend:
    image: portal-prod-backend:${APP_COMMIT}
    container_name: task_backend
    restart: unless-stopped
    build: ${SOURCE_DIR}/backend
    env_file: ./.env
    volumes:
      - ./secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    # Scheduled sync code still lives in the preserved legacy worker image.
    image: portal-kpi-legacy-worker:20260716
    pull_policy: never
    container_name: task_worker
    restart: unless-stopped
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=info --concurrency=2
    env_file: ./.env
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      backend:
        condition: service_healthy

  scheduler:
    image: portal-kpi-legacy-worker:20260716
    pull_policy: never
    container_name: task_scheduler
    restart: unless-stopped
    command: celery -A app.worker.celery_app:celery_app beat --loglevel=info
    env_file: ./.env
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: portal-security-prod-frontend:${APP_COMMIT}
    container_name: task_frontend
    restart: unless-stopped
    build:
      context: ${SOURCE_DIR}/frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_PORTAL_BRAND: securityzone
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  frontend_markee:
    image: portal-markee-prod-frontend:${APP_COMMIT}
    container_name: markee_prod_frontend
    restart: unless-stopped
    build:
      context: ${SOURCE_DIR}/frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_PORTAL_BRAND: markee
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "0.0.0.0:${MARKEE_FRONTEND_PORT:-3300}:3000"
    depends_on:
      backend:
        condition: service_healthy
