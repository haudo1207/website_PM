name: website_pm

services:
  backend:
    image: portal-prod-backend:${APP_COMMIT}
    container_name: task_backend
    restart: unless-stopped
    build: ${SOURCE_DIR}/backend
    env_file: ./.env
    environment:
      RUN_DB_STARTUP_ON_IMPORT: "false"
    volumes:
      - ./secrets:/app/secrets:ro
      - backend-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # worker/scheduler (Celery, portal-kpi-legacy-worker:20260716) removed —
  # ran deprecated Google-Sheet-era tasks (check_sheet/check_all_sheets, both
  # explicit no-ops), no periodic schedule configured, and no service in this
  # stack defines a `redis` host, so both containers only ever logged
  # "Temporary failure in name resolution" retrying against redis:6379 since
  # the day they started — never a single successful connection, never a
  # single task invocation. Nothing in the current app enqueues Celery tasks
  # (redis/celery aren't even in backend/requirements.txt).

  frontend:
    image: portal-security-prod-frontend:${APP_COMMIT}
    container_name: task_frontend
    restart: unless-stopped
    env_file: ./.env
    build:
      context: ${SOURCE_DIR}/frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_PORTAL_BRAND: securityzone
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.shopaikey.com/v1}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-9fcea11b84c54a7882455d271d5722e0}
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  # Persistent Node.js sidecar holding the zca-js session for the "Zalo
  # account for task assignment" feature (cookie login, send, real-time
  # listener) — same role as the dev stack's zalo-worker. Without this,
  # backend's ZALO_WORKER_URL (http://zalo-worker:8090) doesn't resolve at
  # all, so neither sending nor receiving Zalo messages works in prod.
  zalo-worker:
    image: portal-prod-zalo-worker:${APP_COMMIT}
    container_name: task_zalo_worker
    restart: unless-stopped
    build: ${SOURCE_DIR}/services/zalo-worker
    env_file: ./.env
    environment:
      FASTAPI_URL: http://backend:8000
      PORT: "8090"
    volumes:
      - zalo-worker-artifacts:/app/artifacts
    depends_on:
      backend:
        condition: service_healthy

  frontend_markee:
    image: portal-markee-prod-frontend:${APP_COMMIT}
    container_name: markee_prod_frontend
    restart: unless-stopped
    env_file: ./.env
    build:
      context: ${SOURCE_DIR}/frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_PORTAL_BRAND: markee
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.shopaikey.com/v1}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-9fcea11b84c54a7882455d271d5722e0}
    ports:
      - "0.0.0.0:${MARKEE_FRONTEND_PORT:-3300}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-uploads:
  zalo-worker-artifacts:
