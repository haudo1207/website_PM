map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 3000;
    server_name _;

    # Wstunnel validates the full secret path and only permits PostgreSQL dev.
    location /db-tunnel- {
        access_log off;
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # This gateway only ever speaks plain HTTP itself (TLS is terminated
        # in front of it), so nginx's own $scheme is always "http" — hardcode
        # "https" instead, since that's how dev.kpi.markeeai.com is actually
        # reached from the outside. A wrong "http" here gets baked into the
        # "KPI Prototype" extension's API_BASE (route.ts trusts this header),
        # breaking every extension API call: fetch to http:// redirects to
        # https://, and that redirect kills the CORS preflight.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
