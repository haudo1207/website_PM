<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Markee Meeting Host Bot</title>
<style>
  body { font-family: system-ui, sans-serif; width: 360px; padding: 16px; }
  h3 { margin: 0 0 8px; }
  label { display: block; margin-top: 10px; font-size: 12px; color: #555; }
  input { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 14px; margin-right: 8px; padding: 8px 12px; }
  #status { margin-top: 10px; font-size: 12px; white-space: pre-wrap; color: #333; }
</style>
</head>
<body>
  <h3>Markee Meeting Host Bot</h3>
  <label>API Base URL (vd: https://kpi.markeeai.com hoặc http://localhost:8000)
    <input id="apiBaseUrl" placeholder="https://kpi.markeeai.com">
  </label>
  <label>Google Email (tài khoản Gmail Chrome profile này đang đăng nhập)
    <input id="googleEmail" placeholder="ws1@gmail.com">
  </label>
  <label>Bot Token (MEETING_BOT_TOKEN trên backend)
    <input id="botToken" type="password">
  </label>
  <label>Poll interval (giây, khuyến nghị 15-30)
    <input id="pollIntervalSeconds" type="number" min="15" max="120" value="20">
  </label>
  <button id="save">Lưu cấu hình</button>
  <button id="pollNow">Kiểm tra ngay</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
