name: kpi_portal_developer

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kpidev
      POSTGRES_PASSWORD: kpidev2026
      POSTGRES_DB: kpi_portal
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpidev -d kpi_portal"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-./.env}
    environment:
      # Both the company VPN and Cloudflare WARP route this private DB address.
      DATABASE_URL: postgresql+psycopg2://kpidev:kpidev2026@db:5432/kpi_portal
      DEFAULT_ADMIN_EMAIL: admin@company.com
      DEFAULT_ADMIN_PASSWORD: admin123
      AUTH_SUPERADMIN_EMAILS: admin@kpi.markeeai.com
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_PORTAL_BRAND: ${PORTAL_BRAND:-markee}
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:

# WARP on Linux reserves encapsulation overhead. The lower bridge MTU also works
# on the company VPN and prevents Docker-only timeouts while the host can connect.
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "${DOCKER_NETWORK_MTU:-1420}"
