name: kpi_portal_developer

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-./.env}
    environment:
      # Both the company VPN and Cloudflare WARP route this private DB address.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_PORTAL_BRAND: ${PORTAL_BRAND:-markee}
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

# WARP on Linux reserves encapsulation overhead. The lower bridge MTU also works
# on the company VPN and prevents Docker-only timeouts while the host can connect.
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "${DOCKER_NETWORK_MTU:-1420}"