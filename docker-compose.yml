services:
  postgres:
    image: postgres:16
    container_name: task_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: task_portal
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: MyPass2026
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_user -d task_portal"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: task-portal-backend:latest
    container_name: task_backend
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: task-portal-frontend:latest
    container_name: task_frontend
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=/api
        - NEXT_PUBLIC_PORTAL_BRAND=${PORTAL_BRAND:-securityzone}
    env_file:
      - .env
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/data:/app/data
    depends_on:
      - backend

volumes:
  postgres_data:
