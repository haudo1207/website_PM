name: kpi_portal_developer

services:
  db_tunnel:
    image: ghcr.io/erebe/wstunnel:v10.6.1
    restart: unless-stopped
    entrypoint: ["/home/app/wstunnel"]
    command:
      - client
      - --log-lvl
      - WARN
      - --http-upgrade-path-prefix
      - ${DB_TUNNEL_PATH:?Set DB_TUNNEL_PATH in .env}
      - --local-to-remote
      - tcp://0.0.0.0:15432:localhost:5432
      - --connection-min-idle
      - "1"
      - wss://${DB_TUNNEL_HOST:-dev.kpi.markeeai.com}
    ports:
      - "127.0.0.1:${DB_TUNNEL_LOCAL_PORT:-15432}:15432"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-./.env}
    environment:
      # Inside Docker, PostgreSQL is reached through the authenticated WSS tunnel.
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db_tunnel:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_PORTAL_BRAND: ${PORTAL_BRAND:-markee}
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
